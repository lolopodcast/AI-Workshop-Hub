<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 教學資源總入口 · AI Teaching Resources Hub</title>
<meta name="description" content="駱世民教授 AI 教學資源總入口：AI 素養、EMI/EML 教學、課程營運與產品實作互動教材集。Bilingual, responsive, installable.">
<meta name="theme-color" content="#004030">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AI Hub">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700;900&family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  --green:#004030; --green-2:#0a5a42; --green-3:#0d6e50;
  --sand:#d8c3a5; --sand-2:#e8dcc8; --sand-3:#fdf3e7;
  --ink:#0b0b0b; --ink-2:#2a2a28; --muted:#52514e; --muted-2:#898781;
  --bg:#f4f4f4; --surface:#ffffff; --surface-2:#fcfcfb; --line:#e1e0d9;
  --ok:#0a6b0a; --warn:#9a6a00; --err:#d03b3b;
  --serif:"Merriweather",Georgia,"Noto Serif TC",serif;
  --sans:"Inter","Noto Sans TC","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:14px; --r-sm:9px;
  --sh-1:0 1px 2px rgba(0,64,48,.06),0 1px 3px rgba(0,64,48,.04);
  --sh-2:0 4px 6px -1px rgba(0,64,48,.09),0 2px 4px -2px rgba(0,64,48,.05);
  --sh-3:0 12px 22px -8px rgba(0,64,48,.20),0 4px 8px -4px rgba(0,64,48,.10);
  --maxw:1220px;
  /* Live header height, measured in JS so the sticky filter bar can never be
     clipped by the header after a font load, language switch, or resize. */
  /* Header height is pinned in CSS (see .top .bar) so the sticky filter bar's
     offset is correct without waiting on any measurement. JS only corrects it
     if an unusual text size makes the real header taller. */
  --hdr:64px;
}
html[data-theme=dark]{
  --green:#7fd3b4; --green-2:#5cc4a0; --green-3:#43b58e;
  --sand:#d8c3a5; --sand-2:#3a352c; --sand-3:#241f18;
  --ink:#f2f1ec; --ink-2:#dcdad2; --muted:#a9a7a0; --muted-2:#8b8983;
  --bg:#0b0b0b; --surface:#161615; --surface-2:#1d1d1b; --line:#302f2c;
  --ok:#5fd15f; --warn:#e0aa3a; --err:#f07070;
  --sh-1:0 1px 2px rgba(0,0,0,.5); --sh-2:0 4px 8px rgba(0,0,0,.5);
  --sh-3:0 14px 28px -10px rgba(0,0,0,.7);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;height:auto}
a{color:var(--green);text-underline-offset:3px}
:focus-visible{outline:3px solid var(--green-3);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:-999px;top:0;z-index:200;background:var(--green);color:#fff;
  padding:.7rem 1.1rem;border-radius:0 0 var(--r-sm) 0;font-weight:600}
.skip:focus{left:0}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 clamp(1rem,4vw,2rem)}

/* ---------- header ---------- */
header.top{position:sticky;top:0;z-index:100;background:var(--green);color:#fff;
  box-shadow:var(--sh-2)}
html[data-theme=dark] header.top{background:#10221c;border-bottom:1px solid var(--line)}
.top .bar{display:flex;align-items:center;gap:.75rem;min-height:var(--hdr);
  padding:.55rem clamp(1rem,4vw,2rem);max-width:var(--maxw);margin:0 auto}
.brand{display:flex;align-items:center;gap:.65rem;min-width:0;flex:1;
  color:#fff;text-decoration:none}
.mark{flex:0 0 auto;width:38px;height:38px;border-radius:10px;background:var(--sand);
  color:var(--green);display:grid;place-items:center;font-family:var(--serif);
  font-weight:900;font-size:1.05rem;letter-spacing:-.03em}
html[data-theme=dark] .mark{background:var(--sand);color:#10221c}
.brand-txt{min-width:0}
.brand-txt b{display:block;font-family:var(--serif);font-weight:900;font-size:1.02rem;
  line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-txt span{display:block;font-size:.72rem;color:var(--sand);letter-spacing:.04em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;align-items:center;gap:.4rem;flex:0 0 auto}
.tbtn{appearance:none;border:1px solid rgba(216,195,165,.45);background:rgba(255,255,255,.08);
  color:#fff;font:inherit;font-size:.82rem;font-weight:600;padding:.42rem .7rem;
  border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:.35rem;
  transition:background .15s,border-color .15s,transform .1s}
.tbtn:hover{background:rgba(216,195,165,.28)}
.tbtn:active{transform:scale(.96)}
.tbtn.icon{padding:.42rem;width:34px;height:34px;justify-content:center}
#installBtn{background:var(--sand);color:var(--green);border-color:var(--sand)}
#installBtn:hover{background:#e8d5b8}
html[data-theme=dark] #installBtn{color:#10221c}
#installBtn[hidden]{display:none}

/* ---------- hero ---------- */
.hero{background:linear-gradient(160deg,var(--green) 0%,var(--green-2) 100%);color:#fff;
  padding:clamp(2rem,6vw,3.4rem) 0 clamp(3.2rem,8vw,4.6rem)}
html[data-theme=dark] .hero{background:linear-gradient(160deg,#10221c,#0b1a15)}
.hero h1{font-family:var(--serif);font-weight:900;font-size:clamp(1.65rem,5vw,2.7rem);
  line-height:1.2;margin:0 0 .5rem;letter-spacing:-.02em}
.hero .h1en{display:block;font-size:clamp(.9rem,2.4vw,1.2rem);font-weight:700;
  color:var(--sand);margin-top:.35rem;letter-spacing:0}
.hero p.lead{margin:.85rem 0 0;max-width:62ch;color:#e9f0ec;font-size:clamp(.94rem,2.2vw,1.05rem)}
html[data-theme=dark] .hero p.lead{color:var(--ink-2)}
.hero p.lead span{display:block}
.hero p.lead span.en{color:var(--sand);font-size:.9em;margin-top:.2rem}
.stats{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1.4rem}
.stat{background:rgba(255,255,255,.1);border:1px solid rgba(216,195,165,.3);
  border-radius:999px;padding:.34rem .85rem;font-size:.8rem;font-weight:600;color:var(--sand)}

/* ---------- controls ---------- */
.controls{position:sticky;top:var(--hdr);z-index:90;background:var(--bg);
  border-bottom:1px solid var(--line);padding:.8rem 0;margin-top:-2.2rem}
.controls .wrap{display:flex;flex-direction:column;gap:.7rem}
.searchrow{display:flex;gap:.5rem;align-items:center}
.searchbox{flex:1;position:relative;min-width:0}
.searchbox svg{position:absolute;left:.8rem;top:50%;transform:translateY(-50%);
  width:17px;height:17px;color:var(--muted-2);pointer-events:none}
#q{width:100%;font:inherit;font-size:.95rem;padding:.7rem .8rem .7rem 2.4rem;
  border:1.5px solid var(--line);border-radius:999px;background:var(--surface);
  color:var(--ink);box-shadow:var(--sh-1)}
#q:focus{border-color:var(--green-3);outline:none;box-shadow:0 0 0 3px rgba(13,110,80,.16)}
.cbtn{appearance:none;font:inherit;font-size:.83rem;font-weight:600;cursor:pointer;
  border:1.5px solid var(--line);background:var(--surface);color:var(--ink);
  padding:.55rem .85rem;border-radius:999px;white-space:nowrap;
  transition:background .15s,border-color .15s,color .15s}
.cbtn:hover{border-color:var(--green-3);color:var(--green)}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
.chips .lbl{font-size:.73rem;font-weight:700;color:var(--muted);text-transform:uppercase;
  letter-spacing:.07em;margin-right:.15rem}
.chip{appearance:none;font:inherit;font-size:.79rem;font-weight:600;cursor:pointer;
  border:1.5px solid var(--line);background:var(--surface);color:var(--muted);
  padding:.32rem .72rem;border-radius:999px;transition:all .15s}
.chip:hover{border-color:var(--green-3);color:var(--green)}
.chip[aria-pressed=true]{background:var(--green);border-color:var(--green);color:#fff}
html[data-theme=dark] .chip[aria-pressed=true]{background:var(--green);color:#0b1a15}
.chipsep{width:1px;height:20px;background:var(--line);margin:0 .3rem}

/* ---------- sections ---------- */
main{padding:1.6rem 0 4rem}
/* Coarse fallback for a native anchor jump that lands before JS is ready;
   scrollToHash() then re-positions precisely against the live bar heights. */
.cat{margin:0 0 2.4rem;scroll-margin-top:calc(var(--hdr) + 210px)}
.cathead{display:flex;align-items:flex-start;gap:.8rem;padding-bottom:.7rem;
  border-bottom:2px solid var(--line);margin-bottom:1.1rem}
.caticon{flex:0 0 auto;width:40px;height:40px;border-radius:11px;
  background:var(--sand-3);color:var(--green);display:grid;place-items:center;
  font-size:1.05rem;border:1px solid var(--sand-2)}
html[data-theme=dark] .caticon{background:var(--sand-3);border-color:var(--sand-2)}
.cattxt{flex:1;min-width:0}
.cattxt h2{margin:0;font-family:var(--serif);font-weight:900;
  font-size:clamp(1.1rem,3vw,1.42rem);line-height:1.3;letter-spacing:-.015em}
.cattxt .en{display:block;font-family:var(--sans);font-size:.86rem;font-weight:600;
  color:var(--green-3);margin-top:.12rem}
.cattxt .d{margin:.4rem 0 0;font-size:.88rem;color:var(--muted);max-width:80ch}
.cattxt .d .en{color:var(--muted-2);font-weight:400;font-size:.95em}
.catmeta{flex:0 0 auto;display:flex;align-items:center;gap:.4rem;padding-top:.2rem}
.count{font-size:.75rem;font-weight:700;color:var(--muted);background:var(--surface);
  border:1px solid var(--line);border-radius:999px;padding:.2rem .6rem;white-space:nowrap}
.lockpill{font-size:.72rem;font-weight:700;color:var(--warn);background:var(--sand-3);
  border:1px solid var(--sand-2);border-radius:999px;padding:.2rem .55rem;white-space:nowrap}

/* ---------- cards ---------- */
.grid{display:grid;gap:.85rem;grid-template-columns:repeat(auto-fill,minmax(285px,1fr))}
.card{position:relative;display:flex;flex-direction:column;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);padding:1rem 1.05rem 3.1rem;
  box-shadow:var(--sh-1);text-decoration:none;color:inherit;
  transition:transform .16s,box-shadow .16s,border-color .16s}
.card:hover{transform:translateY(-3px);box-shadow:var(--sh-3);border-color:var(--green-3)}
.card:focus-visible{outline:3px solid var(--green-3);outline-offset:2px}
.card h3{margin:0 0 .35rem;font-family:var(--serif);font-weight:700;font-size:1rem;
  line-height:1.38;letter-spacing:-.01em}
.card .ten{display:block;font-family:var(--sans);font-size:.8rem;font-weight:600;
  color:var(--green-3);margin-top:.2rem;line-height:1.4}
.card p{margin:.45rem 0 .6rem;font-size:.845rem;color:var(--muted);line-height:1.58}
.card p .en{display:block;color:var(--muted-2);margin-top:.2rem;font-size:.97em}
.tagrow{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:auto}
.tag{font-size:.68rem;font-weight:700;letter-spacing:.03em;padding:.15rem .5rem;
  border-radius:999px;background:var(--sand-3);color:var(--green);border:1px solid var(--sand-2)}
.tag.aud{background:transparent;color:var(--muted);border-color:var(--line)}
.go{position:absolute;left:1.05rem;bottom:.95rem;font-size:.78rem;font-weight:700;
  color:var(--green-3);display:inline-flex;align-items:center;gap:.3rem}
.card:hover .go{gap:.5rem}
.go svg{width:13px;height:13px;transition:transform .16s}

/* ---------- lock gate ---------- */
.gate{background:var(--surface-2);border:1.5px dashed var(--sand-2);border-radius:var(--r);
  padding:clamp(1.3rem,4vw,2rem);text-align:center}
.gate .ic{font-size:1.7rem;line-height:1}
.gate h3{margin:.5rem 0 .3rem;font-family:var(--serif);font-size:1.02rem;font-weight:700}
.gate p{margin:0 auto .95rem;font-size:.85rem;color:var(--muted);max-width:52ch}
.gate p .en{display:block;color:var(--muted-2);margin-top:.2rem}
.gateform{display:flex;gap:.45rem;justify-content:center;flex-wrap:wrap}
.gateform input{font:inherit;font-size:.92rem;padding:.6rem .85rem;border-radius:999px;
  border:1.5px solid var(--line);background:var(--surface);color:var(--ink);width:min(230px,100%)}
.gateform input:focus{border-color:var(--green-3);outline:none;
  box-shadow:0 0 0 3px rgba(13,110,80,.16)}
.gateform button{appearance:none;font:inherit;font-size:.88rem;font-weight:700;cursor:pointer;
  background:var(--green);color:#fff;border:0;border-radius:999px;padding:.6rem 1.3rem}
html[data-theme=dark] .gateform button{color:#0b1a15}
.gateform button:hover{background:var(--green-2)}
.gatemsg{margin:.7rem 0 0;font-size:.8rem;font-weight:600;color:var(--err);min-height:1.2em}

.empty{text-align:center;padding:3.5rem 1rem;color:var(--muted)}
.empty .ic{font-size:2rem}
.empty p{margin:.6rem 0 0;font-size:.92rem}

footer{border-top:1px solid var(--line);background:var(--surface);padding:1.8rem 0 2.4rem;
  font-size:.82rem;color:var(--muted)}
footer .wrap{display:flex;flex-wrap:wrap;gap:.6rem 1.4rem;align-items:baseline;
  justify-content:space-between}
footer b{color:var(--ink);font-family:var(--serif)}
footer .upd{font-variant-numeric:tabular-nums}

#toTop{position:fixed;right:1rem;bottom:1rem;z-index:95;width:44px;height:44px;
  border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--green);
  box-shadow:var(--sh-2);cursor:pointer;display:grid;place-items:center;
  opacity:0;pointer-events:none;transition:opacity .2s}
#toTop.on{opacity:1;pointer-events:auto}

@media (max-width:640px){
  .brand-txt span{display:none}
  .cathead{flex-wrap:wrap}
  .catmeta{width:100%;padding-top:0}
  .grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}
@media print{
  header.top,.controls,#toTop,.tools{display:none}
  .card{break-inside:avoid;box-shadow:none}
}
/* hide the non-active language when a single-language mode is chosen */
html[data-lang=zh] .en-only{display:none!important}
html[data-lang=en] .zh-only{display:none!important}
</style>
</head>
<body>
<a class="skip" href="#main">跳至主要內容 / Skip to content</a>

<header class="top">
  <div class="bar">
    <a class="brand" href="#main">
      <span class="mark" aria-hidden="true">AI</span>
      <span class="brand-txt">
        <b data-i18n="siteTitle">AI 教學資源總入口</b>
        <span data-i18n="siteOwner">Prof. Shihmin Lo · NCNU</span>
      </span>
    </a>
    <div class="tools">
      <button id="installBtn" class="tbtn" hidden type="button">
        <span aria-hidden="true">⤓</span><span data-i18n="install">安裝</span>

        <span id="themeIcon" aria-hidden="true">◐</span>
      </button>
    </div>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <h1>
      <span class="zh-only" data-i18n="heroZh">AI 教學資源總入口</span>
      <span class="h1en en-only" data-i18n="heroEn">AI Teaching Resources Hub</span>
    </h1>
    <p class="lead">
      <span class="zh-only" id="leadZh"></span>
      <span class="en en-only" id="leadEn"></span>
    </p>
    <div class="stats" id="stats"></div>
  </div>
</section>

<div class="controls">
  <div class="wrap">
    <div class="searchrow">
      <div class="searchbox">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.6-3.6"></path>
        </svg>
        <input id="q" type="search" autocomplete="off" spellcheck="false"
               placeholder="搜尋教材、工具、關鍵字…  Search materials, tools, keywords…"
               aria-label="Search">
      </div>
      <button class="cbtn" id="resetBtn" type="button" data-i18n="reset">清除</button>
    </div>
    <div class="chips" id="chips"></div>

</div>

<main id="main">
  <div class="wrap" id="catalog" aria-live="polite"></div>
  <div class="wrap"><div class="empty" id="empty" hidden>
    <div class="ic" aria-hidden="true">◇</div>
    <p data-i18n="noResult">沒有符合的項目，請調整搜尋或篩選條件。<br>No matching items — try adjusting your search or filters.</p>
  </div></div>
</main>

<footer>
  <div class="wrap">
    <span><b data-i18n="siteTitle">AI 教學資源總入口</b> · <span id="footOwner"></span></span>
    <span class="upd">v<span id="fVer"></span> · <span data-i18n="updated">更新</span> <span id="fUpd"></span></span>
  </div>
</footer>

<button id="toTop" type="button" aria-label="Back to top">
  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
       stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M12 19V5M5 12l7-7 7 7"></path>
  </svg>
</button>

<script>
(function(){
"use strict";

/* ============ i18n ============ */
var STR = {
  zh:{ install:"安裝", reset:"清除", updated:"更新", type:"類型", audience:"對象",
       all:"全部", locked:"需密碼", items:"項", cats:"分類", open:"開啟",
       gateTitle:"此分類需要密碼", gateBtn:"解鎖", gatePh:"請輸入密碼",
       wrong:"密碼不正確，請再試一次。", lock:"重新鎖定",
       noResult:"沒有符合的項目，請調整搜尋或篩選條件。",
       loadFail:"無法載入教材清單（catalog.json）。請確認檔案存在，或以本機伺服器開啟本頁。" },
  en:{ install:"Install", reset:"Clear", updated:"Updated", type:"Type", audience:"Audience",
       all:"All", locked:"Passcode", items:"items", cats:"categories", open:"Open",
       gateTitle:"This section is passcode-protected", gateBtn:"Unlock",
       gatePh:"Enter passcode", wrong:"Incorrect passcode — please try again.",
       lock:"Re-lock", noResult:"No matching items — try adjusting your search or filters.",
       loadFail:"Could not load catalog.json. Check that the file exists, or serve this page over a local server." }
};
var LANGS = ["both","zh","en"];
var LANG_LABEL = { both:"中／EN", zh:"中文", en:"EN" };

var state = {
  lang: localStorage.getItem("hub.lang") || "both",
  theme: localStorage.getItem("hub.theme") || "",
  q: "", tags: [],
  unlocked: {},
  data: null
};
try { state.unlocked = JSON.parse(localStorage.getItem("hub.unlocked") || "{}"); }
catch(e){ state.unlocked = {}; }

function T(k){ return STR[state.lang === "en" ? "en" : "zh"][k]; }
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
/* Bilingual text node: renders zh and en, each hideable by language mode. */
function bi(o, cls){
  if(!o) return "";
  var z = o.zh ? '<span class="zh-only'+(cls?" "+cls:"")+'">'+esc(o.zh)+"</span>" : "";
  var e = o.en ? '<span class="en en-only'+(cls?" "+cls:"")+'">'+esc(o.en)+"</span>" : "";
  return z + e;
}

/* ============ theme ============ */
function applyTheme(){
  var t = state.theme;
  if(!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", t);
  document.getElementById("themeIcon").textContent = t === "dark" ? "☀" : "◐";
  var m = document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute("content", t === "dark" ? "#10221c" : "#004030");
}
document.getElementById("themeBtn").addEventListener("click", function(){
  var cur = document.documentElement.getAttribute("data-theme");
  state.theme = cur === "dark" ? "light" : "dark";
  localStorage.setItem("hub.theme", state.theme);
  applyTheme();
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function(){
  if(!state.theme) applyTheme();
});

/* ============ language ============ */
function applyLang(){
  document.documentElement.setAttribute("data-lang", state.lang);
  document.documentElement.lang = state.lang === "en" ? "en" : "zh-Hant";
  document.getElementById("langLabel").textContent = LANG_LABEL[state.lang];
  document.querySelectorAll("[data-i18n]").forEach(function(el){
    var k = el.getAttribute("data-i18n");
    if(k === "siteTitle" || k === "siteOwner" || k === "heroZh" || k === "heroEn"
       || k === "noResult") return;
    var v = T(k); if(v) el.textContent = v;
  });
  var ph = state.lang === "en" ? "Search materials, tools, keywords…"
        : state.lang === "zh" ? "搜尋教材、工具、關鍵字…"
        : "搜尋教材、工具、關鍵字…  Search materials, tools, keywords…";
  document.getElementById("q").placeholder = ph;
  var nr = document.querySelector('#empty [data-i18n="noResult"]');
  if(nr){
    nr.innerHTML = state.lang === "both"
      ? esc(STR.zh.noResult) + "<br>" + esc(STR.en.noResult)
      : esc(T("noResult"));
  }
  if(state.data) paint();
}
document.getElementById("langBtn").addEventListener("click", function(){
  state.lang = LANGS[(LANGS.indexOf(state.lang) + 1) % LANGS.length];
  localStorage.setItem("hub.lang", state.lang);
  applyLang();
});

/* ============ passcode gate (SHA-256, client-side obfuscation only) ============ */
function sha256hex(str){
  var enc = new TextEncoder().encode(str);
  if(!(crypto && crypto.subtle)) return Promise.reject(new Error("no-subtle"));
  return crypto.subtle.digest("SHA-256", enc).then(function(buf){
    return Array.prototype.map.call(new Uint8Array(buf), function(b){
      return b.toString(16).padStart(2, "0");
    }).join("");
  });
}
function isUnlocked(cat){
  if(!cat.lock || !cat.lock.hash) return true;
  return state.unlocked[cat.id] === cat.lock.hash;
}
function unlock(cat, pass){
  return sha256hex((cat.lock.salt || cat.id) + ":" + pass).then(function(h){
    if(h !== cat.lock.hash) return false;
    state.unlocked[cat.id] = h;
    localStorage.setItem("hub.unlocked", JSON.stringify(state.unlocked));
    return true;
  });
}

/* ============ filtering ============ */
var TYPE_TAGS = ["material","tool","quiz","course","research","video","showcase"];
var AUD_TAGS  = ["teacher","student","exec"];

function tagLabel(t){
  var L = state.data.tagLabels && state.data.tagLabels[t];
  if(!L) return t;
  return state.lang === "en" ? (L.en || t) : (L.zh || t);
}
function matches(item){
  if(state.tags.length){
    for(var i = 0; i < state.tags.length; i++){
      if((item.tags || []).indexOf(state.tags[i]) === -1) return false;
    }
  }
  if(!state.q) return true;
  var hay = [ item.title && item.title.zh, item.title && item.title.en,
              item.desc && item.desc.zh, item.desc && item.desc.en,
              item.url, (item.tags || []).join(" "),
              (item.tags || []).map(tagLabel).join(" ") ]
            .join(" ").toLowerCase();
  return state.q.split(/\s+/).every(function(w){ return !w || hay.indexOf(w) !== -1; });
}

function renderChips(){
  var box = document.getElementById("chips");
  function group(label, list){
    var h = '<span class="lbl">' + esc(label) + "</span>";
    list.forEach(function(t){
      var on = state.tags.indexOf(t) !== -1;
      h += '<button class="chip" type="button" data-tag="' + esc(t) + '" aria-pressed="'
         + on + '">' + esc(tagLabel(t)) + "</button>";
    });
    return h;
  }
  box.innerHTML = group(T("type"), TYPE_TAGS) + '<span class="chipsep"></span>'
                + group(T("audience"), AUD_TAGS);
  box.querySelectorAll(".chip").forEach(function(b){
    b.addEventListener("click", function(){
      var t = b.getAttribute("data-tag"), i = state.tags.indexOf(t);
      if(i === -1) state.tags.push(t); else state.tags.splice(i, 1);
      renderChips(); render();
    });
  });
}

/* ============ render ============ */
function itemCard(it){
  var tags = (it.tags || []).map(function(t){
    var aud = AUD_TAGS.indexOf(t) !== -1;
    return '<span class="tag' + (aud ? " aud" : "") + '">' + esc(tagLabel(t)) + "</span>";
  }).join("");
  return '<a class="card" href="' + esc(it.url) + '" target="_blank" rel="noopener noreferrer">'
    + "<h3>" + (it.title && it.title.zh ? '<span class="zh-only">' + esc(it.title.zh) + "</span>" : "")
    + (it.title && it.title.en ? '<span class="ten en-only">' + esc(it.title.en) + "</span>" : "")
    + "</h3>"
    + (it.desc ? "<p>" + (it.desc.zh ? '<span class="zh-only">' + esc(it.desc.zh) + "</span>" : "")
        + (it.desc.en ? '<span class="en en-only">' + esc(it.desc.en) + "</span>" : "") + "</p>" : "")
    + '<span class="tagrow">' + tags + "</span>"
    + '<span class="go">' + esc(T("open"))
    + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"'
    + ' stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
    + '<path d="M7 17 17 7M9 7h8v8"></path></svg></span></a>';
}

function gateHTML(cat){
  var hint = cat.lock.hint;
  return '<div class="gate" data-gate="' + esc(cat.id) + '">'
    + '<div class="ic" aria-hidden="true">🔒</div>'
    + "<h3>" + esc(T("gateTitle")) + "</h3>"
    + (hint ? "<p>" + bi(hint) + "</p>" : "")
    + '<form class="gateform" autocomplete="off">'
    + '<input type="password" name="pw" placeholder="' + esc(T("gatePh")) + '"'
    + ' aria-label="' + esc(T("gatePh")) + '" required>'
    + '<button type="submit">' + esc(T("gateBtn")) + "</button></form>"
    + '<p class="gatemsg" role="status"></p></div>';
}

function render(){
  var d = state.data, host = document.getElementById("catalog"), html = "", shown = 0;
  var cats = (d.categories || []).filter(function(c){ return c.published !== false; })
              .slice().sort(function(a, b){ return (a.order || 0) - (b.order || 0); });

  cats.forEach(function(cat){
    var items = (cat.items || []).filter(function(i){ return i.published !== false; });
    var locked = !isUnlocked(cat);
    var vis = locked ? items : items.filter(matches);
    /* When filtering/searching is active, hide categories with zero hits.
       A locked category stays visible (its gate is the point) unless filters are active. */
    var filtering = !!(state.q || state.tags.length);
    if(locked && filtering) return;
    if(!locked && !vis.length) return;
    shown += vis.length;

    html += '<section class="cat" id="cat-' + esc(cat.id) + '">'
      + '<div class="cathead">'
      + '<div class="caticon" aria-hidden="true">' + esc(cat.icon || "◆") + "</div>"
      + '<div class="cattxt"><h2>'
      + (cat.name && cat.name.zh ? '<span class="zh-only">' + esc(cat.name.zh) + "</span>" : "")
      + (cat.name && cat.name.en ? '<span class="en en-only">' + esc(cat.name.en) + "</span>" : "")
      + "</h2>"
      + (cat.desc ? '<p class="d">' + bi(cat.desc) + "</p>" : "")
      + "</div>"
      + '<div class="catmeta">'
      + (cat.lock ? '<span class="lockpill">🔒 ' + esc(T("locked")) + "</span>" : "")
      + '<span class="count">' + vis.length + " " + esc(T("items")) + "</span>"
      + (cat.lock && !locked
          ? '<button class="cbtn" type="button" data-relock="' + esc(cat.id) + '">'
            + esc(T("lock")) + "</button>"
          : "")
      + "</div></div>"
      + (locked ? gateHTML(cat)
                : '<div class="grid">' + vis.map(itemCard).join("") + "</div>")
      + "</section>";
  });

  host.innerHTML = html;
  document.getElementById("empty").hidden = html !== "";

  host.querySelectorAll("[data-gate]").forEach(function(box){
    var cid = box.getAttribute("data-gate");
    var cat = cats.filter(function(c){ return c.id === cid; })[0];
    var form = box.querySelector("form"), msg = box.querySelector(".gatemsg");
    form.addEventListener("submit", function(ev){
      ev.preventDefault();
      msg.textContent = "";
      unlock(cat, form.pw.value).then(function(ok){
        if(ok) render(); else { msg.textContent = T("wrong"); form.pw.select(); }
      }).catch(function(){
        msg.textContent = "crypto.subtle unavailable — serve this page over http(s) or a local server.";
      });
    });
  });
  host.querySelectorAll("[data-relock]").forEach(function(b){
    b.addEventListener("click", function(){
      delete state.unlocked[b.getAttribute("data-relock")];
      localStorage.setItem("hub.unlocked", JSON.stringify(state.unlocked));
      render();
    });
  });
}

function renderStatic(){
  var d = state.data, s = d.meta.site;
  document.title = s.title.zh + " · " + s.title.en;
  document.querySelectorAll('[data-i18n="siteTitle"]').forEach(function(el){
    el.textContent = state.lang === "en" ? s.title.en : s.title.zh;
  });
  document.querySelector('[data-i18n="siteOwner"]').textContent = s.subtitle.en;
  document.querySelector('[data-i18n="heroZh"]').textContent = s.title.zh;
  document.querySelector('[data-i18n="heroEn"]').textContent = s.title.en;
  document.getElementById("leadZh").textContent = s.tagline.zh + "　" + s.subtitle.zh;
  document.getElementById("leadEn").textContent = s.tagline.en + " · " + s.subtitle.en;
  document.getElementById("footOwner").textContent =
    state.lang === "en" ? s.subtitle.en : s.subtitle.zh;
  document.getElementById("fVer").textContent = d.meta.version;
  document.getElementById("fUpd").textContent = d.meta.updated;

  var cats = (d.categories || []).filter(function(c){ return c.published !== false; });
  var n = 0, locked = 0;
  cats.forEach(function(c){
    n += (c.items || []).filter(function(i){ return i.published !== false; }).length;
    if(c.lock) locked++;
  });
  var st = document.getElementById("stats");
  st.innerHTML = '<span class="stat">' + n + " " + esc(T("items")) + "</span>"
    + '<span class="stat">' + cats.length + " " + esc(T("cats")) + "</span>"
    + (locked ? '<span class="stat">🔒 ' + locked + " " + esc(T("locked")) + "</span>" : "");
}

/* Everything that carries translatable text is repainted together, so a language
   switch can never leave the chips or the header showing the previous language. */
function paint(){ renderStatic(); renderChips(); render(); queueSync(); }

/* ============ search input ============ */
var qEl = document.getElementById("q"), tmr;
qEl.addEventListener("input", function(){
  clearTimeout(tmr);
  tmr = setTimeout(function(){ state.q = qEl.value.trim().toLowerCase(); render(); }, 140);
});
document.getElementById("resetBtn").addEventListener("click", function(){
  qEl.value = ""; state.q = ""; state.tags = []; renderChips(); render();
  window.scrollTo({ top: 0, behavior: "smooth" });
});
addEventListener("keydown", function(e){
  if(e.key === "/" && document.activeElement !== qEl){ e.preventDefault(); qEl.focus(); }
  if(e.key === "Escape" && document.activeElement === qEl){
    qEl.value = ""; state.q = ""; render(); qEl.blur();
  }
});

/* ============ sticky offset & anchor scrolling ============ */
/* Declared with function/var so paint(), defined earlier, can call these. */
var hdrEl = document.querySelector("header.top");
var ctlEl = document.querySelector(".controls");

/* Only the header height goes into CSS. The filter bar's height is NOT mirrored
   into a custom property: writing one from a ResizeObserver that observes the bar
   trips Chromium's resize-loop guard and the update is silently dropped. It is
   measured on demand in stickyOffset() instead, which is always current. */
function syncHdr(){
  var h = Math.round(hdrEl.getBoundingClientRect().height);
  if(h > 0) document.documentElement.style.setProperty("--hdr", h + "px");
}
/* Bounce the measurement out of the ResizeObserver callback via rAF. Writing a
   custom property straight from the callback re-invalidates layout and Chromium
   drops the follow-up notification as a resize loop, leaving --hdr stale. */
var syncQueued = false;
function queueSync(){
  if(syncQueued) return;
  syncQueued = true;
  requestAnimationFrame(function(){ syncQueued = false; syncHdr(); });
}
function stickyOffset(){
  return hdrEl.getBoundingClientRect().height
       + ctlEl.getBoundingClientRect().height + 14;
}
function scrollToHash(hash, smooth){
  if(!hash || hash.indexOf("#cat-") !== 0) return false;
  var el = document.getElementById(hash.slice(1));
  if(!el) return false;
  var y = window.scrollY + el.getBoundingClientRect().top - stickyOffset();
  window.scrollTo({ top: Math.max(0, y), behavior: smooth ? "smooth" : "auto" });
  return true;
}
queueSync();
if(window.ResizeObserver) new ResizeObserver(queueSync).observe(hdrEl);
addEventListener("resize", queueSync);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(queueSync);
addEventListener("hashchange", function(){ scrollToHash(location.hash, true); });

/* ============ back to top ============ */
var toTop = document.getElementById("toTop");
addEventListener("scroll", function(){ toTop.classList.toggle("on", scrollY > 700); },
  { passive: true });
toTop.addEventListener("click", function(){ window.scrollTo({ top: 0, behavior: "smooth" }); });

/* ============ PWA install ============ */
var deferred = null, ib = document.getElementById("installBtn");
addEventListener("beforeinstallprompt", function(e){
  e.preventDefault(); deferred = e; ib.hidden = false;
});
ib.addEventListener("click", function(){
  if(!deferred) return;
  deferred.prompt();
  deferred.userChoice.then(function(){ deferred = null; ib.hidden = true; });
});
addEventListener("appinstalled", function(){ ib.hidden = true; deferred = null; });
if("serviceWorker" in navigator && location.protocol !== "file:"){
  addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}

/* ============ boot ============ */
applyTheme();
fetch("catalog.json", { cache: "no-cache" })
  .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(function(d){
    state.data = d;
    applyLang();      /* sets data-lang, then paints the whole page */
    /* Honour a deep link (e.g. the manifest shortcuts) now that sections exist. */
    if(location.hash){
      requestAnimationFrame(function(){ scrollToHash(location.hash, false); });
    }
  })
  .catch(function(err){
    document.getElementById("catalog").innerHTML =
      '<div class="empty"><div class="ic">⚠</div><p>' + esc(STR.zh.loadFail)
      + "<br>" + esc(STR.en.loadFail) + "</p></div>";
    console.error("[hub] catalog load failed:", err);
  });
})();
</script>
</body>
